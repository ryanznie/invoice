[project]
name = "invoice-ner-runpod"
version = "0.3.0"
description = "CPU serverless worker runtime dependencies"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.3.3",
    "onnxruntime==1.23.1",
    "openai==3.3.1",
    "pillow==11.3.0",
    "prometheus-client==0.24.1",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.20",
    "runpod==1.12.0",
    "transformers==4.57.0",
]

[tool.uv]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
