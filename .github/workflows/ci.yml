name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Verify Runpod dependency lockfile
      run: uv lock --project deploy/runpod --python 3.11 --check

    - name: Install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv sync --locked --no-default-groups --extra test
    
    - name: Run tests with pytest
      run: |
        source .venv/bin/activate
        pytest --ignore=tests/e2e --cov=src --cov=scripts --cov-report=term-missing --cov-report=json --cov-report=html -v

    - name: Run API contract E2E
      run: |
        rm -f docs/artifacts/api-contract-e2e.json
        source .venv/bin/activate
        pytest --no-cov tests/e2e/test_api_contract.py -v

    - name: Upload API contract E2E artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: api-contract-e2e
        path: docs/artifacts/api-contract-e2e.json
        if-no-files-found: error
        retention-days: 30
    
    - name: Coverage comment
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Run Ruff
      run: uvx --from ruff==0.5.0 ruff check src/demo.py src/runpod_handler.py scripts/*.py tests/*.py tests/e2e/*.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify proxy integration
        run: node tests/proxy-integration.mjs
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/frontend-artifacts/proxy
      - run: npx playwright install --with-deps chromium
      - name: Verify receipt review in Chromium
        env:
          DEMO_PASSWORD: ci-only-demo-password-at-least-32-characters
          BASE_URL: http://localhost:3100
          ARTIFACT_DIR: ${{ runner.temp }}/frontend-artifacts/browser
        run: |
          mkdir -p "$ARTIFACT_DIR"
          npm run start -- --port 3100 > "$ARTIFACT_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null "$BASE_URL"; then break; fi
            sleep 1
          done
          node tests/receipt-review.mjs
      - name: Upload frontend verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-verification
          path: ${{ runner.temp }}/frontend-artifacts
          if-no-files-found: error
          retention-days: 30
