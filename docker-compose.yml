services:
  invoice-ner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-ner-app
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      # Mount models directory to persist downloaded models
      - ${MODELS_DIR:-./models}:/app/models
      # Mount data directory for testing
      - ${DATA_DIR:-./data}:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cpu
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - INFERENCE_BACKEND=triton
      - TRITON_URL=tritonserver:8000
    depends_on:
      - tritonserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: ${TIMEOUT:-10}s
      retries: 3
      start_period: 60s
    # Resource limits (adjust in .env file)
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-4}'
          memory: ${DOCKER_MEMORY_LIMIT:-8G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-2}'
          memory: ${DOCKER_MEMORY_RESERVATION:-4G}

  tritonserver:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: triton-server
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./triton_model_repo:/models
    command: ["tritonserver", "--model-repository=/models"]
    deploy:
      resources:
        limits:
          cpus: '${TRITON_CPU_LIMIT:-4}'
          memory: ${TRITON_MEMORY_LIMIT:-8G}

networks:
  default:
    name: invoice-ner-network
