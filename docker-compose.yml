version: '3.8'

services:
  invoice-ner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-ner-app
    ports:
      - "7860:7860"
    volumes:
      # Mount models directory to persist downloaded models
      - ./models:/app/models
      # Mount data directory for testing
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=cpu
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

networks:
  default:
    name: invoice-ner-network
