version: '3.8'

services:
  invoice-ner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-ner-app
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      # Mount models directory to persist downloaded models
      - ${MODELS_DIR:-./models}:/app/models
      # Mount data directory for testing
      - ${DATA_DIR:-./data}:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEVICE=${DEVICE:-cpu}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: ${TIMEOUT:-10}s
      retries: 3
      start_period: 60s
    # Resource limits (adjust in .env file)
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-4}'
          memory: ${DOCKER_MEMORY_LIMIT:-8G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-2}'
          memory: ${DOCKER_MEMORY_RESERVATION:-4G}

networks:
  default:
    name: invoice-ner-network
